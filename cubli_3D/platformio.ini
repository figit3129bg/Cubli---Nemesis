[platformio]
default_envs = one_test

[env:one_test]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    sparkfun/SparkFun BMI270 Arduino Library
    https://github.com/mjbots/moteus-arduino.git
    pierremolinaro/ACAN_T4
build_src_filter = +<one.cpp> -<main.cpp> -<corner.cpp> -<edge.cpp> -<imu.cpp> -<kalman.cpp>
monitor_speed = 115200

